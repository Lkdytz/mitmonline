<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Public Forum</title>
  <link rel="preload" href="/Funkyfre.ttf" as="font" type="font/ttf" crossorigin="anonymous">
  <style>
    @font-face { font-family: 'MITMFont'; src: url('/Funkyfre.ttf') format('truetype'); font-weight: normal; font-style: normal; font-display: swap; }
    :root{--bg:#FFBF00}
    html,body{height:100%}
    body{font-family:'MITMFont',system-ui,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);margin:0;padding:18px}
    .container{max-width:900px;margin:0 auto}
    .post{background:#fff;padding:12px;border-radius:6px;margin-bottom:12px}
    .post h3{margin:0 0 8px}
    .post-footer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
    .small{font-size:0.9rem;color:#555}
    .meta{font-size:0.85rem;color:#666;margin-bottom:10px}
    .note{font-size:0.95rem;color:#222;margin-bottom:14px}
    .sort-row,.account-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
    .reply-box{margin-top:10px;display:flex;flex-direction:column;gap:8px}
    .reply-list{margin-top:10px;padding-left:14px}
    .reply-item{background:#f8f0b6;padding:8px;border-radius:6px;margin-top:6px}
    .reply-count{font-weight:700}
    .hidden{display:none}
    input,textarea,button{width:100%;padding:10px;border:1px solid #b59a36;border-radius:8px;margin-top:10px;font-family:'MITMFont',inherit}
    button{background:#fff;color:#000;cursor:pointer}
    .small-button{width:auto;padding:8px 12px}
    .inline-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .inline-row input{flex:1}
    .post-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .reaction-btn{border:1px solid #b59a36;background:#fff;padding:6px 10px;border-radius:8px;cursor:pointer}
  </style>
</head>
<body>
  <div class="container">
    <h1>Public Forum</h1>
    <section class="account-row">
      <div id="accountStatus">Not signed in. Posts will publish as Guest.</div>
      <button id="signupBtn" class="small-button">Sign Up</button>
      <button id="loginBtn" class="small-button">Log In</button>
      <button id="signoutBtn" class="hidden small-button">Sign Out</button>
    </section>
    <section class="sort-row">
      <label for="searchInput">Search</label>
      <input id="searchInput" placeholder="Search posts" />
      <label for="sortSelect">Sort posts:</label>
      <select id="sortSelect">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="replies">Most replies</option>
        <option value="leastReplies">Fewest replies</option>
      </select>
    </section>
    <section id="create">
      <input id="title" placeholder="Title" />
      <textarea id="content" placeholder="Write your post..."></textarea>
      <button id="createBtn">Create Post</button>
      <div id="message" class="note"></div>
    </section>
    <hr />
    <section>
      <h2>Posts</h2>
      <div id="posts">Loading posts...</div>
    </section>
  </div>
  <script>
    const api = '/api'
    const postsEl = document.getElementById('posts')
    const createBtn = document.getElementById('createBtn')
    const sortSelect = document.getElementById('sortSelect')
    const searchInput = document.getElementById('searchInput')
    const signupBtn = document.getElementById('signupBtn')
    const loginBtn = document.getElementById('loginBtn')
    const signoutBtn = document.getElementById('signoutBtn')
    const accountStatus = document.getElementById('accountStatus')

    const currentUserKey = 'mitmForumUser'
    const currentUserIdKey = 'mitmForumUserId'
    const currentTokenKey = 'mitmForumToken'
    const guestCounterKey = 'mitmForumGuestCounter'

    let posts = []
    let isEditing = false
    let currentUser = localStorage.getItem(currentUserKey) || ''
    let currentUserId = Number(localStorage.getItem(currentUserIdKey) || 0)
    let currentToken = localStorage.getItem(currentTokenKey) || ''

    document.addEventListener('focusin', (event) => {
      const tag = event.target.tagName
      if (tag === 'INPUT' || tag === 'TEXTAREA') {
        isEditing = true
      }
    })
    document.addEventListener('focusout', (event) => {
      const tag = event.target.tagName
      if (tag === 'INPUT' || tag === 'TEXTAREA') {
        isEditing = false
      }
    })

    function el(tag, attrs){ const e = document.createElement(tag); for (const k in attrs) if (attrs[k] !== undefined) e[k] = attrs[k]; return e }

    function getGuestAuthor() {
      const next = Number(localStorage.getItem(guestCounterKey) || 1)
      localStorage.setItem(guestCounterKey, String(next + 1))
      return `Guest #${next}`
    }

    function updateAccountUI() {
      if (currentUser && currentToken) {
        accountStatus.textContent = `Signed in as ${currentUser}. You can post and reply with this name.`
        signoutBtn.classList.remove('hidden')
        signupBtn.classList.add('hidden')
        loginBtn.classList.add('hidden')
      } else {
        accountStatus.textContent = 'Not signed in. Posts will publish as Guest.'
        signoutBtn.classList.add('hidden')
        signupBtn.classList.remove('hidden')
        loginBtn.classList.remove('hidden')
      }
    }

    async function validateSession() {
      if (!currentToken) return
      try {
        const res = await fetch(`${api}/auth/me`, {
          headers: { 'X-User-Token': currentToken }
        })
        if (!res.ok) {
          signOut()
          return
        }
        const data = await res.json()
        currentUser = data.username
        currentUserId = data.id
        localStorage.setItem(currentUserKey, currentUser)
        localStorage.setItem(currentUserIdKey, String(currentUserId))
        updateAccountUI()
      } catch (err) {
        console.warn('Session validation failed', err)
        signOut()
      }
    }

    async function fetchPosts() {
      if (isEditing) return
      try {
        const res = await fetch(`${api}/posts`)
        const text = await res.text()
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${text}`)
        let data
        try { data = JSON.parse(text) } catch (err) { throw new Error(`Invalid JSON response: ${text}`) }
        posts = data
        renderPosts()
      } catch (err) {
        postsEl.textContent = 'Failed to load posts: ' + err.message
        console.error('fetchPosts error', err)
      }
    }

    function sortPosts(list) {
      const order = sortSelect.value
      if (order === 'oldest') return [...list].sort((a,b) => a.createdAt - b.createdAt)
      if (order === 'replies') return [...list].sort((a,b) => (b.replies?.length || 0) - (a.replies?.length || 0))
      if (order === 'leastReplies') return [...list].sort((a,b) => (a.replies?.length || 0) - (b.replies?.length || 0))
      return [...list].sort((a,b) => b.createdAt - a.createdAt)
    }

    function filterPosts(list) {
      const query = searchInput.value.trim().toLowerCase()
      if (!query) return list
      return list.filter(post => {
        return post.title.toLowerCase().includes(query)
          || post.content.toLowerCase().includes(query)
          || (post.author || '').toLowerCase().includes(query)
          || (post.replies || []).some(reply => reply.content.toLowerCase().includes(query) || (reply.author || '').toLowerCase().includes(query))
      })
    }

    function renderPosts() {
      const list = filterPosts(sortPosts(posts))
      if (!list.length) {
        postsEl.innerHTML = '<p>No posts found. Create one above or change the search.</p>'
        return
      }
      postsEl.innerHTML = ''
      list.forEach(post => {
        const postEl = el('div', { className: 'post' })
        postEl.innerHTML = `
          <h3>${escapeHtml(post.title)}</h3>
          <div class="meta">${escapeHtml(post.author || 'Anonymous')} • ${new Date(post.createdAt).toLocaleString()}</div>
          <p>${escapeHtml(post.content)}</p>
        `

        const actionRow = el('div', { className: 'post-actions' })
        const viewBtn = el('button', { className: 'small-button' })
        viewBtn.textContent = `View replies (${post.replies?.length || 0})`
        actionRow.appendChild(viewBtn)

        const likeBtn = el('button', { className: 'reaction-btn small-button' })
        const userHasLiked = currentUserId && post.likedBy?.includes(currentUserId)
        likeBtn.textContent = userHasLiked ? `❤️ ${post.reactions?.like || 0}` : `👍 ${post.reactions?.like || 0}`
        if (userHasLiked) {
          likeBtn.disabled = true
          likeBtn.style.opacity = '0.6'
        }
        actionRow.appendChild(likeBtn)
        postEl.appendChild(actionRow)

        const repliesSection = el('div', { className: 'reply-list hidden' })
        const repliesHeader = el('div', { innerHTML: `<strong>Replies (${post.replies?.length || 0})</strong>` })
        repliesSection.appendChild(repliesHeader)

        if (post.replies && post.replies.length) {
          post.replies.forEach(reply => {
            const replyEl = el('div', { className: 'reply-item' })
            replyEl.innerHTML = `<span class="small"><strong>${escapeHtml(reply.author || 'Anonymous')}</strong> • ${new Date(reply.createdAt).toLocaleString()}</span><p>${escapeHtml(reply.content)}</p>`
            repliesSection.appendChild(replyEl)
          })
        } else {
          const empty = el('div', { className: 'small' })
          empty.textContent = 'No replies yet.'
          repliesSection.appendChild(empty)
        }

        const replyAuthor = el('input', { placeholder: 'Your name (optional)' })
        const replyContent = el('textarea', { placeholder: 'Reply...' })
        const replyBtn = el('button', { className: 'small-button' })
        replyBtn.textContent = 'Post reply'
        const replyForm = el('div', { className: 'reply-box' })
        replyForm.appendChild(replyAuthor)
        replyForm.appendChild(replyContent)
        replyForm.appendChild(replyBtn)
        repliesSection.appendChild(replyForm)

        viewBtn.addEventListener('click', () => {
          repliesSection.classList.toggle('hidden')
          viewBtn.textContent = repliesSection.classList.contains('hidden') ? `View replies (${post.replies?.length || 0})` : `Hide replies (${post.replies?.length || 0})`
        })

        likeBtn.addEventListener('click', async () => {
          if (!currentToken) {
            return alert('Please log in to like posts.')
          }
          try {
            likeBtn.disabled = true
            const res = await fetch(`${api}/posts/${post.id}/reactions`, {
              method: 'POST',
              headers: { ...getAuthHeaders(), 'Content-Type': 'application/json' },
              body: JSON.stringify({ type: 'like' })
            })
            if (!res.ok) {
              const text = await res.text()
              throw new Error(text || 'Like failed')
            }
            await fetchPosts()
          } catch (err) {
            console.error('reaction error', err)
            alert(err.message || 'Failed to save reaction')
          } finally {
            likeBtn.disabled = false
          }
        })

        replyBtn.addEventListener('click', async () => {
          const content = replyContent.value.trim()
          const author = currentUser || replyAuthor.value.trim() || getGuestAuthor()
          if (!content) return alert('Reply text required')
          try {
            const res = await fetch(`${api}/posts/${post.id}/replies`, {
              method: 'POST',
              headers: getAuthHeaders(),
              body: JSON.stringify({ content, author })
            })
            if (!res.ok) throw new Error(await res.text())
            replyContent.value = ''
            replyAuthor.value = ''
            fetchPosts()
          } catch (err) {
            console.error('reply error', err)
            alert('Failed to send reply')
          }
        })

        postsEl.appendChild(postEl)
        postsEl.appendChild(repliesSection)
      })
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;')
    }

    function getAuthHeaders() {
      const headers = { 'Content-Type': 'application/json' }
      if (currentToken) headers['X-User-Token'] = currentToken
      return headers
    }

    function openSignup() {
      window.location.href = '/signup/index.html'
    }

    function openLogin() {
      window.location.href = '/login/index.html'
    }

    function signOut() {
      currentUser = ''
      currentUserId = 0
      currentToken = ''
      localStorage.removeItem(currentUserKey)
      localStorage.removeItem(currentUserIdKey)
      localStorage.removeItem(currentTokenKey)
      updateAccountUI()
    }

    createBtn.addEventListener('click', async () => {
      const messageEl = document.getElementById('message')
      messageEl.textContent = ''
      const title = document.getElementById('title').value.trim()
      const content = document.getElementById('content').value.trim()
      if (!title || !content) return messageEl.textContent = 'Title and content required.'

      const author = currentUser || getGuestAuthor()

      try {
        const res = await fetch(`${api}/posts`, {
          method: 'POST',
          headers: getAuthHeaders(),
          body: JSON.stringify({ title, content, author })
        })
        const text = await res.text()
        if (!res.ok) throw new Error(text || `HTTP ${res.status}`)
        JSON.parse(text)
        document.getElementById('title').value = ''
        document.getElementById('content').value = ''
        messageEl.textContent = 'Post created.'
        fetchPosts()
      } catch (err) {
        messageEl.textContent = 'Post failed: ' + err.message
        console.error('createPost error', err)
      }
    })

    signupBtn.addEventListener('click', openSignup)
    loginBtn.addEventListener('click', openLogin)
    signoutBtn.addEventListener('click', signOut)
    sortSelect.addEventListener('change', renderPosts)
    searchInput.addEventListener('input', renderPosts)

    updateAccountUI()
    validateSession().then(fetchPosts)
    setInterval(fetchPosts, 3000)
  </script>
</body>
</html>
