<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Log In</title>
  <link rel="preload" href="/Funkyfre.ttf" as="font" type="font/ttf" crossorigin="anonymous">
  <style>
    @font-face { font-family: 'MITMFont'; src: url('/Funkyfre.ttf') format('truetype'); font-weight: normal; font-style: normal; font-display: swap; }
    :root{--bg:#FFBF00}
    html,body{height:100%}
    body{font-family:'MITMFont',system-ui,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);margin:0;padding:18px}
    .container{max-width:520px;margin:0 auto;background:#fff;padding:22px;border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.1)}
    h1{margin-top:0}
    input,button{width:100%;padding:12px;border:1px solid #b59a36;border-radius:8px;margin-top:12px;font-family:'MITMFont',inherit}
    input,textarea,button{font-family:'MITMFont',inherit}
    button{background:#fff;color:#000;cursor:pointer}
    .note{margin-top:12px;color:#555}
    .link-row{margin-top:16px;text-align:center}
    .link-row a{color:#000;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <div class="container">
    <h1>Log In</h1>
    <input id="username" placeholder="Username" />
    <input id="password" type="password" placeholder="Password" />
    <button id="loginBtn">Log in</button>
    <div id="message" class="note"></div>
    <div class="link-row">
      Need an account? <a href="/signup/">Sign up</a>
    </div>
  </div>
  <script>
    const api = '/api'
    const usernameInput = document.getElementById('username')
    const passwordInput = document.getElementById('password')
    const loginBtn = document.getElementById('loginBtn')
    const messageEl = document.getElementById('message')

    async function login() {
      messageEl.textContent = ''
      const username = usernameInput.value.trim()
      const password = passwordInput.value
      if (!username || !password) {
        messageEl.textContent = 'Enter username and password.'
        return
      }
      try {
        const res = await fetch(`${api}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        })
        const data = await res.json()
        if (!res.ok) throw new Error(data.error || 'Login failed')
        localStorage.setItem('mitmForumUser', data.username)
        localStorage.setItem('mitmForumToken', data.token)
        localStorage.setItem('mitmForumUserId', data.id)
        window.location.href = '/forums/index.html'
      } catch (err) {
        messageEl.textContent = err.message
      }
    }

    loginBtn.addEventListener('click', login)
  </script>
</body>
</html>
